<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0d1209"/>

  <!-- Subtle grain pattern overlay -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="1200" height="630" filter="url(#grain)" opacity="0.08"/>

  <!-- Gold rule top -->
  <rect x="80" y="80" width="60" height="2" fill="#b8956a"/>

  <!-- Name — large -->
  <text
    x="80"
    y="280"
    font-family="Georgia, serif"
    font-size="96"
    font-weight="700"
    fill="#e8f4f0"
    letter-spacing="-2"
  >Cameron Hickey</text>

  <!-- Tagline -->
  <text
    x="80"
    y="356"
    font-family="Georgia, serif"
    font-size="32"
    font-style="italic"
    fill="rgba(232,244,240,0.6)"
  >Price is nothing. Value is everything.</text>

  <!-- Gold rule bottom -->
  <rect x="80" y="420" width="60" height="2" fill="#b8956a"/>

  <!-- Domain -->
  <text
    x="80"
    y="500"
    font-family="system-ui, sans-serif"
    font-size="22"
    font-weight="500"
    fill="#b8956a"
    letter-spacing="3"
  >CMRNHCKY.COM</text>
</svg>
